name: Testes Mobile Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      PORT: "3000"
      JWT_SECRET: chave-exclusiva-do-ambiente-de-testes-ci
      MOBILE_BASE_URL: http://10.0.2.2:3000
      ANDROID_UDID: emulator-5554

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.1"
          cache: npm

      - name: Configurar npm
        run: npm install --global npm@11.6.2

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar dependências Mobile
        run: |
          npm ls --depth=0 appium appium-uiautomator2-driver webdriverio
          npx appium driver list --installed

      - name: Preparar banco de testes
        run: |
          mkdir -p database
          rm -f database/biblioteca.db database/biblioteca.db-wal database/biblioteca.db-shm database/biblioteca.db-journal

          node scripts/init_db.js
          node scripts/adicionar_campos_login.js
          node scripts/adicionar_preco_livros.js
          node scripts/criar_tabela_cupons.js
          node scripts/Migrar_cupons.js
          node scripts/preparar_dados_ci.js

      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Executar testes no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: hub_android
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/executar_mobile_ci.sh

      - name: Salvar relatório e logs Mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-mobile-android
          path: relatorios/mobile/
          retention-days: 14
          if-no-files-found: warn